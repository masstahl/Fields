<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Field Headings</title><link rel="manifest" href="/manifest.webmanifest"><meta name="theme-color" content="#2d5a27">
<link rel="apple-touch-icon" href="/icon.svg">
<style>
:root{--g:#2d5a27;--bg:#f7f4ee;--b:#ddd8cc;--m:#8a8678;--r:#b94040}
*{box-sizing:border-box;margin:0}
body{font:16px system-ui,-apple-system,sans-serif;background:var(--bg);color:#1a1a18;padding-bottom:60px}
header{background:var(--g);color:#fff;padding:10px 14px;padding-top:max(10px,env(safe-area-inset-top));position:sticky;top:0;z-index:5}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between}
h1{font-size:1.05rem}.who{font-size:.72rem;opacity:.75;cursor:pointer}
button{font:inherit;font-weight:600;border:0;border-radius:6px;padding:8px 12px;cursor:pointer}
.add{background:#c8a84b}.tabs{display:flex;gap:6px;margin-top:8px}
.tabs button{background:rgba(255,255,255,.18);color:#fff;flex:1;padding:6px}.tabs .on{background:#fff;color:var(--g)}
main{max-width:680px;margin:0 auto;padding:12px}
#q{width:100%;padding:12px;font-size:1rem;border:1.5px solid var(--b);border-radius:8px;margin-bottom:8px}
.card{background:#fff;border:1px solid var(--b);border-radius:8px;padding:12px;margin-bottom:6px}
.top{display:flex;justify-content:space-between;gap:10px;cursor:pointer}
.nm{font-weight:700}.meta{font-size:.75rem;color:var(--m);margin-top:2px}
.hd{font:600 1.3rem ui-monospace,monospace;color:var(--g);text-align:right}.hd small{display:block;font-size:.65rem;color:var(--m)}
.more{margin-top:10px;border-top:1px solid var(--b);padding-top:10px}
iframe,.more img{width:100%;height:260px;border:0;border-radius:6px;background:#ddd;object-fit:cover}
.acts{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}.acts a,.acts button{font-size:.8rem;background:#e8f0e5;color:var(--g);padding:7px 10px;border-radius:6px;text-decoration:none;font-weight:600}
.lg{font-size:.85rem;padding:8px 0;border-bottom:1px solid var(--b)}.lg b{color:var(--g)}.lg i{display:block;color:var(--m);font-size:.72rem}
.empty{text-align:center;color:var(--m);padding:40px 0}
dialog{border:0;border-radius:12px;padding:20px;width:calc(100% - 32px);max-width:400px;margin:auto}
dialog::backdrop{background:rgba(0,0,0,.5)}
dialog label{display:block;font-size:.72rem;font-weight:700;color:var(--m);text-transform:uppercase;margin:10px 0 4px}
dialog input{width:100%;padding:10px;border:1.5px solid var(--b);border-radius:6px;font-size:1rem}
.two{display:flex;gap:8px}.btns{display:flex;gap:8px;margin-top:16px}.btns button{flex:1}
</style></head><body>
<header><div class="row"><div><h1>🥔 Field Headings</h1><div class="who" id="who" onclick="setName(1)"></div></div><button class="add" onclick="openForm()">+ Add Field</button></div>
<div class="tabs"><button id="t-f" class="on" onclick="setTab('f')">Fields</button><button id="t-l" onclick="setTab('l')">Activity</button></div></header>
<main><input id="q" placeholder="Search field name…" autocomplete="off" oninput="render()"><div id="out"></div></main>
<dialog id="dlg"><h2 id="dt"></h2>
<label>Field name</label><input id="fn"><label>Heading (°)</label><input id="fh">
<label>Date planted</label><input id="fd" type="date">
<div class="two"><div><label>Latitude</label><input id="fa" inputmode="decimal"></div><div><label>Longitude</label><input id="fo" inputmode="decimal"></div></div>
<div class="btns"><button onclick="dlg.close()">Cancel</button><button id="del" style="background:#fbeaea;color:var(--r)" onclick="remove()">Delete</button><button style="background:var(--g);color:#fff" onclick="save()">Save</button></div></dialog>
<script>
const MAPS_KEY=''; // optional: Google Static Maps API key (see README). Blank = free embedded map.
const $=s=>document.querySelector(s);
let user=localStorage.user||'',adminKey=localStorage.admin||'',fields=[],tab='f',editId=null,openIds=new Set();
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const api=(p,o={})=>fetch('/api/'+p,{...o,headers:{'content-type':'application/json','x-user':encodeURIComponent(user),'x-admin':adminKey}}).then(r=>r.json());
function setName(force){const n=prompt('Your name (so changes are tracked):',user);if(n&&n.trim()){user=n.trim();localStorage.user=user}else if(!user){user='Guest'}$('#who').textContent='Signed in as '+user+' (tap to change)'}
const dir=d=>isNaN(parseFloat(d))?'':['N','NE','E','SE','S','SW','W','NW'][Math.round(parseFloat(d)/45)%8];
function map(f){if(f.lat==null||f.lng==null)return '<p class="meta">No coordinates saved — tap Edit to add them.</p>';const c=f.lat+','+f.lng;
 const img=MAPS_KEY?`<img loading="lazy" src="https://maps.googleapis.com/maps/api/staticmap?center=${c}&zoom=16&size=640x400&scale=2&maptype=hybrid&markers=color:red%7C${c}&key=${MAPS_KEY}">`:`<iframe loading="lazy" src="https://maps.google.com/maps?q=${c}&t=h&z=16&output=embed"></iframe>`;
 return img+`<div class="acts"><a target="_blank" href="https://www.google.com/maps/search/?api=1&query=${c}">Open in Google Maps</a></div>`}
function render(){
 if(tab==='l')return;
 const q=$('#q').value.trim().toLowerCase(),list=q?fields.filter(f=>f.name.toLowerCase().includes(q)):[];
 if(!q){$('#out').innerHTML=`<div class="empty">${fields.length} fields loaded.<br>Type a field name to search.</div>`;return}
 if(!list.length){$('#out').innerHTML='<div class="empty">No match. Tap + Add Field.</div>';return}
 $('#out').innerHTML=list.slice(0,60).map(f=>`<div class="card"><div class="top" onclick="tog(${f.id})"><div><div class="nm">${esc(f.name)}</div>
 <div class="meta">${esc(f.planted||'no date')}${f.lat!=null?' · '+f.lat.toFixed(5)+', '+f.lng.toFixed(5):''}</div></div>
 <div class="hd">${esc(f.heading)}${isNaN(+f.heading)?'':'°'}<small>${dir(f.heading)}</small></div></div>
 ${openIds.has(f.id)?`<div class="more">${map(f)}<div class="acts"><button onclick="openForm(${f.id})">✏️ Edit</button></div>${f.updated_by?`<div class="meta" style="margin-top:6px">Last changed by ${esc(f.updated_by)}</div>`:''}</div>`:''}</div>`).join('')}
function tog(id){openIds.has(id)?openIds.delete(id):openIds.add(id);render()}
async function load(){if(dlg.open)return;try{fields=await api('fields');render()}catch(e){}}
async function loadLog(){if(tab!=='l')return;const r=await api('log');
 if(r.error){const k=prompt('Enter the admin key to view activity:');if(k){adminKey=k;localStorage.admin=k;return loadLog()}$('#out').innerHTML='<div class="empty">Admin key needed.</div>';return}
 $('#out').innerHTML=r.length?r.map(x=>`<div class="lg"><b>${esc(x.user)}</b> ${esc(x.action)} ${esc(x.detail)}<i>${new Date(x.at.replace(' ','T')+'Z').toLocaleString()}</i></div>`).join(''):'<div class="empty">No activity yet.</div>'}
function setTab(t){tab=t;$('#t-f').className=t==='f'?'on':'';$('#t-l').className=t==='l'?'on':'';$('#q').style.display=t==='f'?'':'none';t==='f'?render():loadLog()}
function openForm(id){editId=id||null;const f=fields.find(x=>x.id===id)||{};$('#dt').textContent=id?'Edit field':'Add field';
 fn.value=f.name||$('#q').value||'';fh.value=f.heading??'';fd.value=f.planted||new Date().toISOString().slice(0,10);fa.value=f.lat??'';fo.value=f.lng??'';$('#del').style.display=id?'':'none';dlg.showModal()}
async function save(){if(!fn.value.trim()||!fh.value.trim())return alert('Field name and heading are required.');
 const b=JSON.stringify({name:fn.value.trim(),heading:fh.value.trim(),planted:fd.value,lat:fa.value,lng:fo.value});
 await api(editId?'fields/'+editId:'fields',{method:editId?'PUT':'POST',body:b});dlg.close();load()}
async function remove(){if(confirm('Delete this field?')){await api('fields/'+editId,{method:'DELETE'});dlg.close();load()}}
setName();if(!sessionStorage.o){api('open',{method:'POST',body:'{"event":"open"}'});sessionStorage.o=1}
addEventListener('appinstalled',()=>api('open',{method:'POST',body:'{"event":"installed"}'}));
load();setInterval(()=>tab==='f'?load():loadLog(),12000);
</script></body></html>
